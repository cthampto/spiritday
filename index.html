<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spirit Day VIP Kiosk - Ross-Ade Stadium</title>
  <style>
    body { font-family: Arial, sans-serif; background: #000; color: #CFB991; text-align: center; padding: 3rem 1rem; }
    .card { max-width: 480px; margin: 0 auto; border: 3px solid #CFB991; border-radius: 12px; padding: 2rem; }
    h1 { margin-top: 0; }
    button { background: #CFB991; color: #000; font-size: 1.1rem; font-weight: bold; border: 0; border-radius: 6px; padding: .75rem 1.5rem; cursor: pointer; }
    button:disabled { background: #555; color: #999; cursor: not-allowed; }
    #output { margin-top: 1.5rem; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gold &amp; Black VIP Pass</h1>
    <p>Price: $0</p>
    <p>Checkout is restricted to administrators on an internal CIT subnet.</p>
    <button id="vip-btn" onclick="verifyCheckout()">Claim VIP Pass</button>
    <div id="output"></div>
  </div>
  <script>
    document.cookie = "is_spirit_vip=false; path=/; SameSite=Lax";

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const BLOB = {
      salt: "nTM0pS6KIAGVg8uAY1zAVg==",
      iv: "Nni9JlmPPEWbUWZA",
      data: "9cSxf22dRNT1QFy6a6aIRCV2W1vdQ45nGRKSrbnqrqfclTmIPcDbk2QrPcdgmZ6+nMJTKQEPt1bV"
    };

    async function verifyCheckout() {
      const m = document.cookie.match(/(?:^|; )is_spirit_vip=([^;]*)/);
      try {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(m ? m[1] : ""), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(BLOB.salt), iterations: 200000, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.iv) }, key, b64(BLOB.data));
        document.getElementById("output").innerText = "SUCCESS! Flag: " + new TextDecoder().decode(plain);
      } catch (e) {
        alert("Unauthorized! Administrator cookie missing.");
      }
    }
  </script>
</body>
</html>
